<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Resep - Resep Nusantara</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/recipe-detail.css">
    <script type="module" src="js/pages/recipe-detail-page.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="title"><h1 class="logo-text">Resep Nusantara</h1></div>
            <div class="search-bar">
                <input type="text" placeholder="Cari resep..." aria-label="Cari resep">
                <button type="button" aria-label="Cari"><i class="fas fa-search"></i></button>
            </div>
            <div class="nav-links">
                <a href="afterlogin.html">Beranda</a>
                <a href="upload.html">Upload Resep</a>
                <a href="my-recipes.html">Resep Saya</a>
                <a href="saved-recipes.html">Disimpan</a>
            </div>
            <div class="user-profile">
                <div class="profile-info">
                    <img src="images/profile abu.jpg" alt="Profil" class="profile-img">
                    <span class="profile-name" id="displayUsername"></span>
                </div>
            </div>
            <div class="mobile-menu-btn"><i class="fas fa-bars"></i></div>
        </div>
    </nav>

    <main class="recipe-detail" data-recipe-id="">
        <div class="recipe-header">
            <div class="recipe-image">
                <img id="recipeImage" src="" alt="">
                <button id="saveRecipeBtn" class="save-btn" type="button">
                    <i class="far fa-bookmark"></i> Simpan
                </button>
            </div>
            <div class="recipe-meta">
                <h1 id="recipeTitle"></h1>
                <div class="author-info">
                    <img id="authorAvatar" src="images/profile abu.jpg" alt="Penulis">
                    <div><span id="authorName"></span><span id="uploadDate"></span></div>
                </div>
                <div class="stats">
                    <div class="stat-item"><i class="far fa-clock"></i><span id="cookingTime"></span> menit</div>
                    <div class="stat-item"><i class="fas fa-utensils"></i><span id="servings"></span> porsi</div>
                </div>
            </div>
        </div>
        <section class="recipe-section">
            <h2>Deskripsi</h2>
            <p id="recipeDescription"></p>
        </section>
        <section class="recipe-section">
            <h2>Bahan-bahan</h2>
            <ul id="ingredientsList" class="ingredients-list"></ul>
        </section>
        <section class="recipe-section">
            <h2>Langkah Pembuatan</h2>
            <ol id="stepsList" class="steps-list"></ol>
        </section>
        <section class="recipe-section">
            <h2>Rating &amp; Ulasan</h2>
            <div class="rating-form">
                <div class="stars" aria-label="Pilih rating">
                    <button class="star" type="button" data-value="1" aria-label="1 bintang"><i class="far fa-star"></i></button>
                    <button class="star" type="button" data-value="2" aria-label="2 bintang"><i class="far fa-star"></i></button>
                    <button class="star" type="button" data-value="3" aria-label="3 bintang"><i class="far fa-star"></i></button>
                    <button class="star" type="button" data-value="4" aria-label="4 bintang"><i class="far fa-star"></i></button>
                    <button class="star" type="button" data-value="5" aria-label="5 bintang"><i class="far fa-star"></i></button>
                </div>
                <textarea id="reviewText" placeholder="Bagaimana pengalaman Anda mencoba resep ini?" aria-label="Komentar ulasan"></textarea>
                <button id="submitReviewBtn" class="btn-submit" type="button">Kirim Ulasan</button>
            </div>
            <div id="reviewsContainer" class="reviews-container"></div>
        </section>
    </main>
</body>
</html>
