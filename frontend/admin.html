<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Resep Nusantara</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <script type="module" src="js/pages/admin-page.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="title"><h1 class="logo-text">Resep Nusantara</h1></div>
            <div class="nav-links">
                <a href="afterlogin.html">Lihat Website</a>
                <a href="upload.html">Upload Resep</a>
            </div>
            <div class="user-profile">
                <div class="profile-info">
                    <img src="images/profile abu.jpg" alt="Profile" class="profile-img">
                    <span class="profile-name" id="displayUsername"></span>
                </div>
            </div>
        </div>
    </nav>

    <main class="admin-main">
        <header class="admin-header">
            <p class="eyebrow">Panel Admin</p>
            <h1>Kelola konten Resep Nusantara</h1>
            <p>Review request resep pengguna dan publikasikan event untuk komunitas.</p>
        </header>

        <section class="admin-section" aria-labelledby="recipeRequestsTitle">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">Moderasi</p>
                    <h2 id="recipeRequestsTitle">Request resep</h2>
                </div>
                <span id="requestCount" class="count-badge">0</span>
            </div>
            <div id="recipeRequests" class="admin-list"></div>
        </section>

        <section class="admin-section" aria-labelledby="eventFormTitle">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">Publikasi</p>
                    <h2 id="eventFormTitle">Tambah event</h2>
                </div>
            </div>
            <form id="eventForm" class="admin-form">
                <label>Nama event<input id="eventTitle" required maxlength="120"></label>
                <label>Poster event<input id="eventPoster" type="file" accept="image/*" required></label>
                <div class="form-row">
                    <label>Tanggal<input id="eventDate" type="datetime-local" required></label>
                    <label>Lokasi<input id="eventLocation" required maxlength="160"></label>
                </div>
                <label>Deskripsi<textarea id="eventDescription" rows="4" required></textarea></label>
                <label>Link pendaftaran Google Form<input id="registrationUrl" type="url" placeholder="https://forms.gle/..." required></label>
                <button class="admin-button" type="submit"><i class="fas fa-plus"></i> Publikasikan event</button>
                <p id="eventFormMessage" class="form-message" role="status"></p>
            </form>
        </section>

        <section class="admin-section" aria-labelledby="eventListTitle">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">Konten aktif</p>
                    <h2 id="eventListTitle">Event terpublikasi</h2>
                </div>
            </div>
            <div id="eventsList" class="admin-list"></div>
        </section>
    </main>
</body>
</html>
