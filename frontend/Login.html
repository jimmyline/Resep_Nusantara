<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resep Nusantara - Login</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">
    <main class="auth-page">
        <div class="auth-horizon" aria-hidden="true"></div>
        <section class="auth-card login-container">
            <div class="auth-card-header">
                <div class="logo">
                    <h1>Resep Nusantara</h1>
                </div>
                <p class="auth-intro">Kembali ke meja makan yang penuh cerita.</p>
            </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Masukkan username Anda">
                <div class="error-message" id="usernameError">Username harus diisi</div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Masukkan password Anda">
                <div class="error-message" id="passwordError">Password harus diisi</div>
            </div>

            <button type="submit">Login</button>
        </form>

            <div class="footer-auth">
                Belum punya akun? <a href="register.html">Daftar disini</a>
            </div>
            <div class="auth-clouds" aria-hidden="true">
            </div>
        </section>
    </main>

    <script type="module">
        import { apiRequest, saveSession } from './js/data/api-client.js';

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const usernameError = document.getElementById('usernameError');
            const passwordError = document.getElementById('passwordError');

            let isValid = true;

            if (username.trim() === '') {
                usernameError.style.display = 'block';
                isValid = false;
            } else {
                usernameError.style.display = 'none';
            }

            if (password === '') {
                passwordError.style.display = 'block';
                isValid = false;
            } else {
                passwordError.style.display = 'none';
            }

            if (isValid) {
                try {
                    const payload = await apiRequest('/auth/login', {
                        method: 'POST',
                        body: JSON.stringify({ username, password })
                    });
                    saveSession(payload);
                    alert('Login berhasil!');
                    window.location.href = payload.user.role === 'admin'
                        ? 'admin.html'
                        : 'afterlogin.html';
                } catch (error) {
                    passwordError.textContent = error.message;
                    passwordError.style.display = 'block';
                }
            }
        });
    </script>
</body>
</html>
